<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">有種直送訂購表格預覽</title>
  <desc id="desc">以農場鮮菜照片和表格欄位示意訂購步驟，可於 GitHub 更換此檔案。</desc>
  <rect width="1200" height="820" fill="#f4efe1"/>
  <rect x="34" y="34" width="1132" height="752" fill="#fff" stroke="#c9c3a8" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="82" fill="#1e5a2c"/>
  <text x="78" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">ROOT DIRECT　有種直送</text>
  <text x="78" y="166" font-family="Arial, sans-serif" font-size="16" letter-spacing="4" fill="#6b6659">ORDER FORM — 訂購表格</text>
  <text x="78" y="216" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#171714">選擇菜包及填寫資料</text>
  <text x="78" y="255" font-family="Arial, sans-serif" font-size="19" fill="#6b6659">提交訂購資料，完成付款後上載截圖</text>
  <rect x="78" y="294" width="485" height="68" fill="#fff" stroke="#c9c3a8" stroke-width="2"/>
  <text x="100" y="336" font-family="Arial, sans-serif" font-size="18" fill="#6b6659">選擇訂購方案　⌄</text>
  <rect x="78" y="382" width="485" height="68" fill="#fff" stroke="#c9c3a8" stroke-width="2"/>
  <text x="100" y="424" font-family="Arial, sans-serif" font-size="18" fill="#6b6659">姓名 / 聯絡資料</text>
  <rect x="78" y="470" width="485" height="68" fill="#fff" stroke="#c9c3a8" stroke-width="2"/>
  <text x="100" y="512" font-family="Arial, sans-serif" font-size="18" fill="#6b6659">送貨地址</text>
  <rect x="78" y="558" width="485" height="130" fill="#fff" stroke="#c9c3a8" stroke-width="2"/>
  <text x="100" y="600" font-family="Arial, sans-serif" font-size="18" fill="#6b6659">付款證明 / 備註</text>
  <rect x="78" y="716" width="190" height="48" fill="#0db04b"/>
  <text x="173" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">提交表格</text>
  <rect x="640" y="166" width="472" height="528" fill="#e2ecd5"/>
  <image href="/images/veg-01.jpg" x="662" y="188" width="428" height="380" preserveAspectRatio="xMidYMid slice"/>
  <rect x="662" y="588" width="428" height="84" fill="#fff"/>
  <text x="684" y="625" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#318741">FARM TO TABLE</text>
  <text x="684" y="655" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#171714">從農田，直送餐桌</text>
</svg>
